name: Component request
description: An app needs something DesignKit does not have, or draws a view by hand that could be DesignKit's.
title: "Component: "
labels: ["component request"]
body:
  - type: markdown
    attributes:
      value: |
        Every view that can be generic lives in DesignKit, even if one app uses it (CLAUDE.md,
        "What Belongs in DesignKit"). Before asking, look the need up in docs/components.md and
        docs/agents.md ("What a screen needs → the component"): it may already exist under another
        name, or as a parameter or style of a component.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Tenra
        - Dalada
        - Platina
        - Another
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen
      description: Where the app needs it (a screen, a sheet, a row of a list).
      placeholder: "Game screen, the trophy's rarity under its title"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What the person should see and do
      description: What it shows, what a tap does, its states (loading, empty, error, disabled).
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What the app does today
      description: The view drawn by hand (its file in the app), or the DesignKit component it bends to fit.
  - type: textarea
    id: considered
    attributes:
      label: DesignKit components considered
      description: Which ones come close, and what each is missing (a parameter, a style, a state).
  - type: textarea
    id: pictures
    attributes:
      label: Screenshot or mockup
      description: Drop images here; a reference from another app is welcome.
