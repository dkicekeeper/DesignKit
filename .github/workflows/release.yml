name: Release

# Tags a release when VERSION on main names a version that is not tagged yet:
# annotated tag X.Y.Z on that commit + a GitHub Release listing the commits since the
# previous tag. Bumping VERSION in a PR is how a DesignKit release is cut; consumers pin
# these tags (Dalada picks new ones up with its DesignKit bump workflow).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION is already tagged"
            exit 0
          fi
          PREVIOUS=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          {
            echo "Changes${PREVIOUS:+ since $PREVIOUS}:"
            echo
            git log --no-merges --format='- %s' ${PREVIOUS:+$PREVIOUS..}HEAD | head -60
          } > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "DesignKit $VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "DesignKit $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Released DesignKit $VERSION" >> "$GITHUB_STEP_SUMMARY"
