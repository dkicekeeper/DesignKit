name: Release

# Release numbers are given at merge (docs/releasing.md). A PR declares its release in a note,
# .changes/<name>.md, and writes the bare token vNext where it would name its version. On every
# push to main this runs the release bot (.github/scripts/release.py run): with notes in .changes/
# it gives them the next version, writes VERSION, the CHANGELOG.md section and the component
# reference, replaces the token, commits "Release X.Y.Z", tags it, publishes the GitHub Release
# with the section as its notes and starts the TestFlight build on the tag; without notes it only
# regenerates the component reference. A VERSION left untagged (a run that stopped after its
# commit) is tagged first. A failed run comments on the PRs whose notes it holds; run it again
# from Actions once the cause is fixed. Consumers pin these tags (each app's DesignKit update
# workflow picks new ones up).
#
# The bot pushes with GITHUB_TOKEN, so its commit starts no other workflow: that is why it starts
# TestFlight itself (workflow_dispatch is the one event that token may trigger).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# One run at a time, none cancelled: each run starts from the newest main, so a run that waited
# picks up whatever the one before it left.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history: the version, the PRs, the compare link

      - name: Release the notes in .changes/
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py run
