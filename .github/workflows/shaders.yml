name: Shaders

# Компилирует Metal-шейдеры (Shaders/*.metal) в два .metallib, которые пакет поставляет готовыми
# (Sources/DesignComponents/Resources/Shaders), и коммитит их в ветку. Так приложениям не нужен
# Metal Toolchain: в Xcode 26 это отдельная загрузка (~700 МБ), и на раннерах GitHub его бывает
# нет. Подробнее: docs/motion.md, «Ripple».
on:
  push:
    branches: ["claude/**"]
    paths:
      - "Shaders/**"
  workflow_dispatch:

concurrency:
  group: shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile shaders
    if: github.ref != 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Metal Toolchain
        run: |
          xcodebuild -version
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk iphoneos metal --version
          fi

      - name: Compile
        run: Shaders/build.sh

      - name: Commit the libraries
        run: |
          git add Sources/DesignComponents/Resources/Shaders
          if git diff --cached --quiet; then
            echo "The libraries are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(shaders): compile Metal libraries" \
            -m "Compiled by CI (Shaders/build.sh) on $(xcodebuild -version | awk 'NR == 1')."
          git push origin "HEAD:$GITHUB_REF_NAME"
