name: CI

# Сборка пакета, Gallery и приложений-потребителей на macOS. Код DesignKit часто пишется в
# облачном контейнере на Linux, где SwiftUI не собрать: ошибки компиляции видны здесь.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      dalada_ref:
        description: "Dalada branch to build against this DesignKit"
        default: main
      tenra_ref:
        description: "Tenra branch to build against this DesignKit"
        default: main
      record_snapshots:
        description: "Snapshot references to (re)write and commit to this branch (docs/snapshots.md)"
        type: choice
        options: [never, missing, failed, all]
        default: never

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  package:
    name: Package + Gallery
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build package for iOS Simulator
        run: |
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          echo "Schemes:"; echo "$SCHEMES"
          SCHEME=$(echo "$SCHEMES" | grep -x 'DesignKit-Package' || echo "$SCHEMES" | grep -x 'DesignKit' || echo "$SCHEMES" | head -1)
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet

      - name: Run package tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, items in sorted(devices.items(), reverse=True)
                 if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")]
          print(ids[0])
          ')
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          SCHEME=$(echo "$SCHEMES" | grep -x 'DesignKit-Package' || echo "$SCHEMES" | grep -x 'DesignKit' || echo "$SCHEMES" | head -1)
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            2>&1 | tee test.log | grep -aE "Test case .* failed|recorded an issue|error:|\*\* TEST (SUCCEEDED|FAILED)|Test run with" || true
          grep -aq "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Build Gallery
        working-directory: Gallery
        run: |
          # Gallery.xcodeproj закоммичен, но генерируется из project.yml: пересобираем, чтобы
          # новые файлы экранов не требовали ручной правки project.pbxproj.
          brew install xcodegen
          xcodegen generate
          xcodebuild build \
            -project Gallery.xcodeproj \
            -scheme Gallery \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Toolchain
        if: always()
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version

  xcode27:
    name: Package on Xcode 27
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # DesignKit обязан собираться и в Xcode 26, и в Xcode 27 (CLAUDE.md). Код под iOS 27 SDK
      # стоит за `#if compiler(>=6.4)`, и компилирует его только Xcode 27: задача Package + Gallery
      # (latest-stable, Xcode 26) его не видит. Пока на раннере GitHub нет Xcode 27, задача
      # предупреждает и проходит; когда он появится в образе, проверка включится сама.
      - name: Find Xcode 27
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            INSTALLED=$(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')
            echo "::warning title=Xcode 27 not installed::The runner image has no Xcode 27 ($INSTALLED), so the iOS 27 code paths were not compiled."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            sudo xcode-select -s "$XCODE"
            xcodebuild -version
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package for iOS Simulator
        if: steps.xcode.outputs.found == 'true'
        run: |
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          SCHEME=$(echo "$SCHEMES" | grep -x 'DesignKit-Package' || echo "$SCHEMES" | grep -x 'DesignKit' || echo "$SCHEMES" | head -1)
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet

  snapshots:
    name: Snapshot tests
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Manual runs can record references (never on main: they change only through a PR).
      RECORD: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.record_snapshots || 'never' }}
    steps:
      - uses: actions/checkout@v5

      # Pinned: the reference images were recorded with this Xcode's iOS runtime. Moving it
      # means re-recording (record_snapshots: all) in the same PR.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Compare components with the reference images
        if: env.RECORD == 'never'
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-artifacts
        run: scripts/snapshot-tests.sh

      # The images that differ, to look at next to the references in the repo.
      - name: Upload failing snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-snapshots
          path: ${{ runner.temp }}/snapshot-artifacts
          if-no-files-found: ignore

      - name: Record references (${{ env.RECORD }})
        if: env.RECORD != 'never'
        env:
          SNAPSHOT_TESTING_RECORD: ${{ env.RECORD }}
        # Recording reports every written image as a failure; the images are what we need.
        run: scripts/snapshot-tests.sh || true

      # A push made with the workflow token does not start CI: re-run CI on the branch.
      - name: Commit references
        if: env.RECORD != 'never'
        run: |
          git add Gallery/SnapshotTests/__Snapshots__
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(snapshots): record references ($RECORD)" \
            -m "Recorded by CI (record_snapshots: $RECORD) on $(xcodebuild -version | awk 'NR == 1')."
          git push origin "HEAD:$GITHUB_REF_NAME"

  dalada:
    name: Dalada against this DesignKit
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: DesignKit

      - uses: actions/checkout@v5
        with:
          repository: dkicekeeper/Dalada
          ref: ${{ inputs.dalada_ref || 'main' }}
          path: Dalada

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Point Dalada at the local DesignKit
        run: |
          MANIFEST=Dalada/ios/Packages/DaladaKit/Package.swift
          # Любая форма зависимости (revision:/from:/exact:/branch:) заменяется локальным путём.
          sed -i '' -E 's#\.package\(url: "https://github.com/dkicekeeper/DesignKit"[^)]*\)#.package(path: "'"$GITHUB_WORKSPACE"'/DesignKit")#' "$MANIFEST"
          grep -n 'DesignKit' "$MANIFEST"
          grep -q "path: \"$GITHUB_WORKSPACE/DesignKit\"" "$MANIFEST"

      - name: Generate Dalada project
        working-directory: Dalada/ios
        run: |
          brew install xcodegen
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate

      - name: Build Dalada for iOS Simulator
        working-directory: Dalada/ios
        run: |
          xcodebuild build \
            -project Dalada.xcodeproj \
            -scheme Dalada \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  tenra:
    name: Tenra against this DesignKit
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: DesignKit

      - uses: actions/checkout@v5
        with:
          repository: dkicekeeper/Tenra
          ref: ${{ inputs.tenra_ref || 'main' }}
          path: Tenra

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Point Tenra at the local DesignKit
        id: point
        run: |
          PBXPROJ=Tenra/Tenra.xcodeproj/project.pbxproj
          if ! grep -q 'XCRemoteSwiftPackageReference "DesignKit" \*/ = {' "$PBXPROJ"; then
            # Tenra before its migration carries its own copy of the design system.
            echo "::notice::Tenra ${{ inputs.tenra_ref || 'main' }} does not depend on DesignKit — nothing to check."
            echo "uses=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The remote package reference (any requirement) becomes a local one; the product
          # dependency keeps pointing at the same object id.
          perl -0pi -e 's#(/\* XCRemoteSwiftPackageReference "DesignKit" \*/ = \{)\s*isa = XCRemoteSwiftPackageReference;.*?\n\t\t\};#$1\n\t\t\tisa = XCLocalSwiftPackageReference;\n\t\t\trelativePath = ../DesignKit;\n\t\t};#s' "$PBXPROJ"
          grep -n -A3 'XCRemoteSwiftPackageReference "DesignKit" \*/ = {' "$PBXPROJ"
          grep -q 'relativePath = ../DesignKit;' "$PBXPROJ"
          echo "uses=true" >> "$GITHUB_OUTPUT"

      - name: Build Tenra for iOS Simulator
        if: steps.point.outputs.uses == 'true'
        working-directory: Tenra
        run: |
          xcodebuild build \
            -project Tenra.xcodeproj \
            -scheme Tenra \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
