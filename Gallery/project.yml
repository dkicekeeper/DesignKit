name: Gallery
options:
  bundleIdPrefix: com.designkit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  DesignKit:
    path: ".."

targets:
  Gallery:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Gallery
    dependencies:
      - package: DesignKit
        product: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.DesignKitGallery
        # Bundle and display names must not be another App Store app's (ITMS-90129 rejected
        # "DesignKit"; plain "Gallery" risks the same), so both follow the App Store Connect
        # app record, "DesignKit Gallery".
        PRODUCT_NAME: DesignKitGallery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DesignKit Gallery
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Portrait only → full screen is required, otherwise App Store Connect rejects the
        # upload (error 90474: without it the app must support every orientation for iPad
        # multitasking). Same setting as Dalada.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # The TestFlight workflow overrides both: the version from /VERSION, the build number
        # from the workflow run number.
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: SY2L2VMQP7
        CODE_SIGN_STYLE: Automatic
