name: Gallery
options:
  bundleIdPrefix: com.designkit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  DesignKit:
    path: ".."
  # Snapshot tests only (GallerySnapshotTests). The DesignKit package itself has no
  # dependencies, so the apps that consume it never fetch this.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

targets:
  Gallery:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Gallery
      # The repository's changelog, read by the Updates screen (Gallery/Updates/Changelog.swift).
      - path: ../CHANGELOG.md
        buildPhase: resources
      # The component reference the release bot writes; a page's Parameters panel reads it
      # (Gallery/ComponentReference.swift).
      - path: ../docs/components.json
        buildPhase: resources
    dependencies:
      - package: DesignKit
        product: DesignKit
    # Shared "Gallery" scheme: builds and archives the app, `xcodebuild test` runs the
    # snapshot tests hosted in it (docs/snapshots.md).
    scheme:
      testTargets:
        - GallerySnapshotTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.DesignKitGallery
        # Bundle and display names must not be another App Store app's (ITMS-90129 rejected
        # "DesignKit"; plain "Gallery" risks the same), so both follow the App Store Connect
        # app record, "DesignKit Gallery".
        PRODUCT_NAME: DesignKitGallery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DesignKit Gallery
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # A phone in portrait; an iPad (and a Mac, which runs the iPad app) in every orientation,
        # which iPad multitasking requires (App Store Connect error 90474 otherwise), so a Mac
        # window and Split View can be any width and the pages show their wide layout.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The voice effects' pages (VoiceWave, EdgeGlow) can follow the microphone's level; nothing
        # is recorded or kept.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lets the voice effects follow your voice. Nothing is recorded or kept."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone and iPad (8.22.3); a Mac runs it as an app for iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Gallery/Localizable.xcstrings holds only the English values of DesignKit's keys
        # (docs/localization-keys.md). Without this, building in Xcode would add every Gallery
        # Text literal to it.
        SWIFT_EMIT_LOC_STRINGS: NO
        # The TestFlight workflow overrides both: the version from /VERSION, the build number
        # from the workflow run number.
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: SY2L2VMQP7
        CODE_SIGN_STYLE: Automatic

  # Snapshot tests of the DesignKit components, hosted in the Gallery app so Liquid Glass
  # renders in a real window. References: SnapshotTests/__Snapshots__ (docs/snapshots.md).
  GallerySnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SnapshotTests
        excludes:
          - "__Snapshots__"
          - "__Snapshots__/**"
      # The changelog's parser, checked against the bundled CHANGELOG.md (ChangelogTests).
      - path: Gallery/Updates/Changelog.swift
    dependencies:
      - target: Gallery
      - package: DesignKit
        product: DesignKit
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.DesignKitGallery.SnapshotTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DesignKitGallery.app/DesignKitGallery"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: SY2L2VMQP7
        CODE_SIGN_STYLE: Automatic
